# Tasarım sistemi v3: docs/tasarim/arayuz-v3.md · ayrıntılı stil: src/card_fraud_detection/ui/theme.py
[theme]
base = "dark"
backgroundColor = "#0a0f1c"
secondaryBackgroundColor = "#101828"
textColor = "#f1f5f9"
# Amber "fener" marka ve eylem rengi; kırmızı yalnızca alarm, yeşil yalnızca onay (theme.py)
primaryColor = "#f5b544"
borderColor = "#22304a"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Herkese açık demo: hata olursa yığın izi ve dosya yolları gösterilmez
showErrorDetails = "none"

[server]
headless = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
