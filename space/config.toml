# Tasarım sistemi v2: docs/tasarim/arayuz-v2.md · ayrıntılı stil: src/card_fraud_detection/ui/theme.py
[theme]
base = "dark"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0e1223"
textColor = "#f8fafc"
# Eylem mavisi; kırmızı yalnızca alarm, yeşil yalnızca onay içindir (theme.py)
primaryColor = "#2563eb"
borderColor = "#26314a"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Herkese açık demo: hata olursa yığın izi ve dosya yolları gösterilmez
showErrorDetails = "none"

[server]
headless = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
