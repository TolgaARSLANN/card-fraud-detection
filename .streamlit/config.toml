[theme]
base = "dark"
backgroundColor = "#0b101a"
secondaryBackgroundColor = "#121a28"
textColor = "#ebe7de"
# Sinyal rengi (#f05a36) yalnızca alarm içindir; sıradan eylemler sakin mavi
primaryColor = "#6f8fd1"
borderColor = "#26324a"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
