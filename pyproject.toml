[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-fraud-detection"
version = "0.1.0"
description = "Kart işlemlerinde dolandırıcılık tespiti: dengesiz veride uçtan uca makine öğrenmesi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "matplotlib", "seaborn"]
ml = ["optuna>=3.6", "xgboost>=2.0", "imbalanced-learn>=0.12", "shap>=0.45"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "shap>=0.45"]
ui = ["streamlit>=1.65", "plotly>=5.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Ham CSV örneği tek satırda gerçek dosyayla aynı biçimde kalmalı
"tests/test_download.py" = ["E501"]
# CSS kuralları ve HTML parçaları tek satırda daha okunur
"src/card_fraud_detection/ui/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# SHAP'ın kendi iç kodundan gelen uyarılar (bizim kodumuzla ilgili değil)
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore:LightGBM binary classifier with TreeExplainer:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
